name: BrowseCraft

options:
  bundleIdPrefix: xiefei
  xcodeVersion: "26.6"
  deploymentTarget:
    iOS: "17.0"
  groupSortPosition: top
  generateEmptyDirectories: true

configs:
  Debug: debug
  Release: release
  TestFlight: release

settings:
  base:
    # 中文注释：Swift 6 语言模式。四个包同日一并切到 `.swiftLanguageMode(.v6)`；
    # 切换前已量过代价为零（四个包各 0 错误，App 与测试目标 0 错误 0 编译器警告）。
    # 它把此前「complete 严格并发 + 警告为零」这一当下状态固化成编译错误，防止悄悄漂回去。
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    CURRENT_PROJECT_VERSION: "19"
    MARKETING_VERSION: "1.0"
    CODE_SIGN_STYLE: Automatic
    # 中文注释：团队 ID 必须写在这里。XcodeGen 每次重新生成都会覆盖 project.pbxproj，
    # 在 Xcode 界面里设的团队会被抹掉，下次归档就会报 "requires a development team"。
    DEVELOPMENT_TEAM: SG84FDK26C
    TARGETED_DEVICE_FAMILY: "1,2"
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    CLANG_ANALYZER_LOCALIZABILITY_NONLOCALIZED: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES
    # 中文注释：让 swiftc 把 Text / Label / Section / String(localized:) 等要本地化的字面量写进
    # Objects-normal/<arch>/*.stringsdata，本地化闸门（scripts/check-localization.py）读的就是它。
    SWIFT_EMIT_LOC_STRINGS: YES

packages:
  BrowseCraftCore:
    path: ../BrowseCraftCore
  BrowseCraftDomain:
    path: ../BrowseCraftDomain
  BrowseCraftRuntime:
    path: ../BrowseCraftRuntime
  BrowseCraftAPIKit:
    path: ../BrowseCraftAPIKit
  KSPlayer:
    url: https://github.com/kingslay/KSPlayer.git
    # 中文注释：KSPlayer 不打 tag，锁定到具体 commit；升级时改这里并同步 Package.resolved。
    revision: 10a40a1c0001d75307ad5922d1d1bc0cb01c89b4
  WebUI:
    url: https://github.com/cybozu/WebUI.git
    exactVersion: 4.4.0
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads.git
    from: 12.0.0
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk.git
    from: 12.0.0
  Alamofire:
    url: https://github.com/Alamofire/Alamofire.git
    exactVersion: 5.11.2
  # 中文注释：6.24.1 的 SPM target 在当前工具链上缺 strcmp 声明（CocoaPods 变体没这问题）；
  # 6.29.3 显式 import Darwin/string_h 修复，仍在 6.x 内，API 兼容。
  GRDB:
    url: https://github.com/groue/GRDB.swift.git
    exactVersion: 6.29.3
  # 中文注释：Nuke 12 起 NukeUI 是同一个包内的 target，不再依赖 Gifu。
  Nuke:
    url: https://github.com/kean/Nuke.git
    exactVersion: 12.8.0
  # 中文注释：Readium 只用于读书 kind（EPUB/PDF/有声书 Navigator + Locator 书签）；漫画线仍是自研阅读器，
  # 不接 ReadiumNavigator 的 CBZ 分支。锁定 3.x 稳定 tag，不跟 develop/4.0 alpha。
  Readium:
    url: https://github.com/readium/swift-toolkit.git
    exactVersion: 3.11.0
  # 中文注释：SwiftSoup 本地覆盖包。BrowseCraftCore 按 commit 锁定自家 fork（上游 2.13.5+ 的 text() 空白 bug
  # 已修），而 Readium 依赖官方 scinfu/SwiftSoup，两者同标识不同 URL 会让 SPM 报冲突；Xcode 对同标识的本地包
  # 会覆盖整张依赖图里的远程引用，于是 Readium 也被指到 fork。本地 checkout 必须与 Core 锁定的 commit 一致，
  # 由 scripts/check-swiftsoup-override.sh 把关。它不被任何目标 import，SwiftSoup 的边界规则不变。
  SwiftSoup:
    path: ../SwiftSoup

targets:
  BrowseCraft:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: BrowseCraft
        excludes:
          - "**/*.md"
    dependencies:
      - package: BrowseCraftCore
        product: BrowseCraftCore
      # 中文注释：Core 拆分后规则模型在独立 target 里，`import BrowseCraftCore` 经 @_exported 能看见这些类型，
      # 但链接期仍要显式带上这个库（界面层直接用到 BookReaderRule 等）。
      - package: BrowseCraftCore
        product: BrowseCraftRuleModels
      - package: BrowseCraftDomain
        product: BrowseCraftDomain
      - package: BrowseCraftRuntime
        product: BrowseCraftRuntime
      - package: BrowseCraftAPIKit
        product: BrowseCraftAPIKit
      - package: KSPlayer
        product: KSPlayer
      - package: WebUI
        product: WebUI
      - package: GoogleMobileAds
        product: GoogleMobileAds
      - package: Firebase
        product: FirebaseCore
      - package: Firebase
        product: FirebaseCrashlytics
      - package: Firebase
        # 中文注释：应用未申请 ATT/IDFA；使用 Analytics Core，避免链接广告身份
        # 支持后又缺少 IdentitySupport 所产生的启动警告。
        product: FirebaseAnalyticsCore
      - package: Alamofire
        product: Alamofire
      - package: GRDB
        product: GRDB
      - package: Nuke
        product: Nuke
      - package: Nuke
        product: NukeUI
      - package: Readium
        product: ReadiumShared
      - package: Readium
        product: ReadiumStreamer
      - package: Readium
        product: ReadiumNavigator
    configFiles:
      Debug: Config/CatalogEncryption.debug.xcconfig
      Release: Config/CatalogEncryption.release.xcconfig
      TestFlight: Config/CatalogEncryption.testflight.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xiefei.AnyPortal
        PRODUCT_NAME: AnyPortal
        PRODUCT_MODULE_NAME: BrowseCraft
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: BrowseCraft/Info.plist
        CODE_SIGN_ENTITLEMENTS: BrowseCraft/BrowseCraft.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # 中文注释：这一行设的是 UIKit 的 window tintColor 与 IB 预览，对纯 SwiftUI 的
        # Color.accentColor **不自动生效**——后者读的是环境值，默认就是系统蓝，
        # 除非在根视图上显式 .tint(...)。BrowseCraftApp 里没有那一句，所以
        # AccentColor.colorset 的取值从来没有被画出来过。
        # 2026-09-20 实测：界面上所有 .accentColor 处都是 #0088FF 系统蓝（色相 208°），
        # 而当时 colorset 里写的是 #AF86C6 紫（277°）——那是配早期紫色 bitmoji 图标留下的，
        # 已改成系统蓝的标准取值，免得下一个人以为改它就能换主题色。
        # 真要换主题色，得同时做两件事：改这里的 colorset，并在根视图加 .tint(Color("AccentColor"))。
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # Crashlytics and the post-embed FFmpeg bundle patch both need access
        # outside statically declared script inputs and outputs.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
      configs:
        Debug:
          APS_ENVIRONMENT: development
          BROWSECRAFT_ENVIRONMENT_NAME: TEST
          BROWSECRAFT_REWARDED_AD_UNIT_ID: ca-app-pub-3940256099942544/1712485313
          DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
          "DEBUG_INFORMATION_FORMAT[sdk=iphonesimulator*]": dwarf
        Release:
          APS_ENVIRONMENT: production
          BROWSECRAFT_ENVIRONMENT_NAME: PROD
          # 仍是 Google 官方测试广告；scripts/check-ad-configuration.sh 会在 PROD archive 时拒绝
          # 这个值，App Store 正式发布前必须替换为正式广告单元。
          BROWSECRAFT_REWARDED_AD_UNIT_ID: ca-app-pub-3940256099942544/1712485313
        TestFlight:
          # Store-distributed test builds need Release-style linking and the
          # production APNs entitlement while retaining the TEST environment.
          APS_ENVIRONMENT: production
          BROWSECRAFT_ENVIRONMENT_NAME: TEST
          BROWSECRAFT_REWARDED_AD_UNIT_ID: ca-app-pub-3940256099942544/1712485313
          DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
          ENABLE_DEBUG_DYLIB: NO
    preBuildScripts:
      - name: Check Architecture Boundaries
        basedOnDependencyAnalysis: false
        script: |
          "${SRCROOT}/scripts/check-architecture-boundaries.sh"
      - name: Check Ad Configuration
        basedOnDependencyAnalysis: false
        script: |
          "${SRCROOT}/scripts/check-ad-configuration.sh"
      # 中文注释：随包位图资产没有任何既有用例覆盖——换错格式是界面空白，多带冗余 scale 槽位是包体
      # 悄悄变大。闸门按 scripts/bundled-image-asset-budgets.txt 的显式声明检查。
      - name: Check Bundled Image Assets
        basedOnDependencyAnalysis: false
        script: |
          "${SRCROOT}/scripts/check-bundled-image-assets.sh"
      # 中文注释：../SwiftSoup 本地覆盖包必须与 BrowseCraftCore 锁定的 fork commit 一致，否则 Xcode 构建
      # 与 swift test 用的不是同一份解析器。
      - name: Check SwiftSoup Override
        basedOnDependencyAnalysis: false
        script: |
          "${SRCROOT}/scripts/check-swiftsoup-override.sh"
    # 中文注释：本地化闸门放在编译之后——它要读 swiftc 刚写出的 .stringsdata。编译器认定要本地化的键
    # 三份 Localizable.strings 都必须有；闸门上线时已缺的键登记在 scripts/localization-missing-baseline.txt，只许收敛。
    postCompileScripts:
      - name: Check Localization
        basedOnDependencyAnalysis: false
        script: |
          "${SRCROOT}/scripts/check-localization.py"
    postBuildScripts:
      - name: Upload Crashlytics Symbols
        basedOnDependencyAnalysis: false
        inputFiles:
          - ${DWARF_DSYM_FOLDER_PATH}/${DWARF_DSYM_FILE_NAME}
          - ${DWARF_DSYM_FOLDER_PATH}/${DWARF_DSYM_FILE_NAME}/Contents/Resources/DWARF/${PRODUCT_NAME}
          - ${DWARF_DSYM_FOLDER_PATH}/${DWARF_DSYM_FILE_NAME}/Contents/Info.plist
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/GoogleService-Info.plist
          - $(TARGET_BUILD_DIR)/$(EXECUTABLE_PATH)
        script: |
          "${BUILD_DIR%/Build/*}/SourcePackages/checkouts/firebase-ios-sdk/Crashlytics/run"
      - name: Patch FFmpegKit Bundle Identifiers
        basedOnDependencyAnalysis: false
        script: |
          FRAMEWORK_PATH="${TARGET_BUILD_DIR}/${WRAPPER_NAME}/Frameworks/libshaderc_combined.framework"
          FRAMEWORK_PLIST="${FRAMEWORK_PATH}/Info.plist"
          if [ -f "$FRAMEWORK_PLIST" ]; then
            /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier com.kintan.ksplayer.libshaderc-combined" "$FRAMEWORK_PLIST"

            # The framework has already been signed by the embed phase. Changing
            # Info.plist invalidates that signature and leaves its identifier at
            # the original underscore-based value, so sign the patched bundle again.
            if [ -n "${EXPANDED_CODE_SIGN_IDENTITY:-}" ] && [ "${CODE_SIGNING_ALLOWED:-YES}" != "NO" ]; then
              /usr/bin/codesign --force \
                --sign "$EXPANDED_CODE_SIGN_IDENTITY" \
                --preserve-metadata=entitlements,flags,runtime \
                "$FRAMEWORK_PATH"
            fi
          fi

  BrowseCraftTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: BrowseCraftTests
        excludes:
          - "Resources/PreflightFixtures/**"
      # 中文注释：归档 fixture 以 folder reference 进 bundle，保留 site-*/ 子目录，避免 manifest.json 平铺撞名。
      - path: BrowseCraftTests/Resources/PreflightFixtures
        type: folder
        buildPhase: resources
    dependencies:
      - target: BrowseCraft
      - package: BrowseCraftCore
        product: BrowseCraftCore
      # 中文注释：Core 拆分后规则模型在独立 target 里，`import BrowseCraftCore` 经 @_exported 能看见这些类型，
      # 但测试目标仍要显式链接这个库，否则 PaginationRule 等符号在链接期找不到。
      - package: BrowseCraftCore
        product: BrowseCraftRuleModels
      - package: BrowseCraftDomain
        product: BrowseCraftDomain
      - package: BrowseCraftRuntime
        product: BrowseCraftRuntime
      - package: GRDB
        product: GRDB
      - package: Nuke
        product: Nuke
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: xiefei.BrowseCraftTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/AnyPortal.app/AnyPortal"

  BrowseCraftUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: BrowseCraftUITests
    dependencies:
      - target: BrowseCraft
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: xiefei.BrowseCraftUITests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  BrowseCraft:
    build:
      targets:
        BrowseCraft: all
        BrowseCraftTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - BrowseCraftTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  TEST BrowseCraft:
    build:
      targets:
        BrowseCraft: all
        BrowseCraftTests: [test]
    run:
      config: Debug
      environmentVariables:
        BROWSECRAFT_CATALOG_ENCRYPTION_KEYS: "$(BROWSECRAFT_CATALOG_ENCRYPTION_KEYS)"
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - BrowseCraftTests
    profile:
      config: Debug
    analyze:
      config: Debug
    archive:
      config: TestFlight

  PROD BrowseCraft:
    build:
      targets:
        BrowseCraft: all
    run:
      config: Release
      environmentVariables:
        BROWSECRAFT_CATALOG_ENCRYPTION_KEYS: "$(BROWSECRAFT_CATALOG_ENCRYPTION_KEYS)"
    profile:
      config: Release
    analyze:
      config: Release
    archive:
      config: Release
